<DOCTYPE HMTL>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixeLab</title>
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <img class="logo_login" src="/imagens/logo-principal.svg" alt="logo do site">
    </header>
    <main>  
        <h3 class="texlog">Login</h3>
        <section>
            <label for="usuario">Email ou CPF</label><br>
            <input type="text" name="usuario" id="usuario"><br><br>
            <label for="senha">Senha</label><br>
            <input type="password" name="senha" id="senha"><br><br> 
            <div class="separacaobotao">
                <button type="button" class="btn btn-outline-secondary btn-sem-conta">Não tenho conta</button>
                <button type="button" class="btn btn-outline-primary btn-entrar">Entrar</button>
            </div>  
            <a id="esqueci" href="">Esqueci a senha</a>
        </section>
        <section>
            <img class="botaogoogle" src="/imagens/button google.png"  alt="Cadastrar com google">
        </section> 
    </main>
</body>
</html>
