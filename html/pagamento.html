<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link rel="stylesheet" href="/css/perfil.css">
    
    <title>PixeLab</title>
</head>
<body>
    <header>
        <!-- Barra de navegação -->
        <div class="menu">
        <button type="button" id="botao-menu" class="icone-menu" aria-label="Abrir menu">
            <img src="/imagens/icone-menu.png" alt="">
        </button>

        <button type="button" id="pesquisa" class="lupa" aria-label="Pesquisar">
            <img src="/imagens/icone-lupa.png" alt="">
        </button>

        <a href="/html/index.html" class="logo">
            <img src="/imagens/logo-horizontal.svg" alt="PixelLab Cursos de Tecnologia">
        </a>

        <a href="/html/login.html" id="botao-perfil" class="foto-perfil" aria-label="Abrir perfil">
            <img src="/imagens/foto-perfil.png" alt="Área da foto e acesso ao perfil">
        </a>
        </div>

    </header>
    <main>
        <h1>Pagamento</h1>
         <section>
          <h2 class="sub">Forma de pagamento</h2>
            <div class="ingressar_curso">
            <label><input type="radio" name="Ingressar" value="1">Pix</label>
            <label><input type="radio" name="Ingressar" value="2">Cartão de Crédito</label>
            <label><input type="radio" name="Ingressar" value="3">Boleto Bancário</label>
            </div>
        </section>
        <section>
            <hr>
            <p class="sub">Prenche os dados</p>
            <label for="nome">Nome completo(Como está no cartão)</label>
            <input class="pagam" type="text" name="nome" id="nome">
            <label for="numero-cartao">Número do Cartão</label> 
            <div class="pagando">
                <input class=" cartao pagam" type="text" id="numero-cartao" placeholder="0000 0000 0000 0000" inputmode="numeric" autocomplete="cc-number"maxlength="23">
                <img class="logocartao" src="/imagens/mastercad_logo.png" alt="logo cartão">
            </div>   
            <label for="cpf">CPF</label>
            <input class="pagam" type="text" name="cpf" id="cpf">
            <label for="datavencimento">Data de Vencimento</label>
            <input class="pagam" type="text" name="datavencimento" id="datavencimento">
            <input class="pagam" type="text" name="datavencimento" id="datavencimento">
            <label for="cod-seguranca">Código de segurança</label>
            <input class="pagam" type="text" name="cod-seguranca" id="cod-seguranca">


           
        </section>
        <button type="button"  class=" btn btn-outline-primary">Finalizar</button>
    </main>
    <footer>
        <section class="contatos">
            <h6>Contato</h6>
            <address>
                <p>Email: <a href="mailto:pixelab@outlook.com">pixelab@outlook.com</a></p>
                <p>Telefone: <a href="tel:+5599999999999">(99) 99999-9999</a></p>
            </address>
        </section>

        <section class="redes-sociais">
            <h6>Redes Sociais</h6>
            <ul>
                <li><a href="#">Facebook</a></li>
                <li><a href="#">Instagram</a></li>
            </ul>
        </section>

        <img class="footer-logo" src="/imagens/logo-monocromatica-branca.svg" alt="Logo do Footer">

        <p class="direitos-autorais">
            <small>© PixelLab 2026 - 2027. Todos os direitos reservados.</small>
        </p>
    </footer>
</body>
</html>
