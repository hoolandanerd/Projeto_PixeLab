<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link rel="stylesheet" href="/css/perfil.css">
    <!-- JavaScript-->
    <script src="/js/script.js" defer></script>
    
    <title>PixeLab</title>
</head>
<body>
    <header>
        <!-- Barra de navegação -->
        <div class="menu">

            <!-- Menu Hambúrguer -->
            <div class="menu-hamburguer">

                <button type="button" id="botao-menu"
                    class="icone-menu"
                    aria-label="Abrir menu"
                    aria-expanded="false"
                    aria-controls="opcoes-menu">

                    <img src="/imagens/icone-menu.png" alt="">
                </button>

                <nav id="opcoes-menu" class="opcoes-menu"
                    aria-label="Tipos de cursos" hidden>

                    <p>Tipos de cursos:</p>

                    <ul>
                        <li><a href="/html/tipos-cursos/livres.html">Livres</a></li>
                        <li><a href="/html/tipos-cursos/tecnicos.html">Técnicos</a></li>
                        <li><a href="/html/tipos-cursos/tecnologos.html">Tecnólogos</a></li>
                        <li><a href="/html/tipos-cursos/bacharel.html">Bacharelado</a></li>
                    </ul>

                </nav>

            </div>

            <!-- Lupa de Pesquisa -->
            <button type="button" id="pesquisa" class="lupa"
                aria-label="Pesquisar">
                <img src="/imagens/icone-lupa.png" alt="">
            </button>

            <!-- Logo -->
            <a href="/html/index.html" class="logo">
                <img src="/imagens/logo-horizontal.svg"
                    alt="PixelLab Cursos de Tecnologia">
            </a>

            <!-- Ícone / Foto do Perfil -->
            <a href="/html/login.html" id="botao-perfil"
                class="foto-perfil" aria-label="Abrir perfil">
                <img src="/imagens/foto-perfil.png"
                    alt="">
            </a>

        </div>

    </header>
    <main>
        <h1>Pagamento</h1>
         <section>
          <h2 class="sub">Forma de pagamento</h2>
            <div class="ingressar_curso">
            <label><input type="radio" name="Ingressar" value="1">Pix</label>
            <label><input type="radio" name="Ingressar" value="2">Cartão de Crédito</label>
            <label><input type="radio" name="Ingressar" value="3">Boleto Bancário</label>
            </div>
        </section>

        <section>
        <hr>
        <div class="dados-cartao">

            <div class="grupo-campo">
                <label for="nome">Nome completo (Como está no cartão)</label>
                <input class="pagam" type="text" id="nome">
            </div>

            <div class="grupo-campo">
                <label for="numero-cartao">Número do Cartão</label>

                <div class="campo-numero-cartao">
                    <input class="pagam" type="text"
                        id="numero-cartao"
                        placeholder="0000 0000 0000 0000">

                    <img class="logocartao"
                        src="/imagens/mastercad_logo.png"
                        alt="Bandeira do cartão">
                </div>
            </div>

            <div class="grupo-campo">
                <label for="cpf">CPF</label>
                <input class="pagam" type="text" id="cpf">
            </div>

            <div class="pagando">

                <div class="campo-data">
                    <label>Data de Vencimento</label>

                    <div class="data-inputs">
                        <input class="pagam" type="text"
                            id="mes" placeholder="Mês">

                        <input class="pagam" type="text"
                            id="ano" placeholder="Ano">
                    </div>
                </div>

                <div class="campo-cvv">
                    <label for="cod-seguranca">Código de segurança</label>
                    <input class="pagam" type="text" id="cod-seguranca">
                </div>

            </div>

        </div>
        <button type="button"  class=" btn-cartao btn btn-outline-primary">Cadastrar</button>
    </main>

    <footer>
        <section class="contatos">
            <h6>Contato</h6>
            <address>
                <p>Email: <a href="mailto:pixelab@outlook.com">pixelab@outlook.com</a></p>
                <p>Telefone: <a href="tel:+5599999999999">(99) 99999-9999</a></p>
            </address>
        </section>

        <section class="redes-sociais">
            <h6>Redes Sociais</h6>
            <ul>
                <li><a href="#">Facebook</a></li>
                <li><a href="#">Instagram</a></li>
            </ul>
        </section>

        <img class="footer-logo" src="/imagens/logo-monocromatica-branca.svg" alt="Logo do Footer">

        <p class="direitos-autorais">
            <small>© PixelLab 2026 - 2027. Todos os direitos reservados.</small>
        </p>
    </footer>
</body>
</html>
