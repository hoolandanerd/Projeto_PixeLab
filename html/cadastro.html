<DOCTYPE HMTL>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixeLab</title>
    <link rel="stylesheet" href="/css/cadastro.css">
</head>
<body>
    <main>
        <img class="logo_login" src="/imagens/logo-principal.svg" alt="logo do site">
        <section>
            <p>Prenche os dados para o cadastro </p>
            <label for="nome">Nome completo:</label>
            <input type="text" name="nome" id="nome" required>
            <label for="cpf">CPF:</label>
            <input type="number" name="cpf" id="cpf" required>
            <label for="data">Data de nascimento:</label>
            <input type="date" name="data" id="data">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            <label for="celular">Celular:</label>
            <input type="number" name="celular" id="celular" required placeholder="(00) 00000-0000">
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" required>
            <label for="confirma">Confirmar senha:</label>
            <input type="password" name="confirma" id="confirma">
        </section>
        <button id="cadastro">Cadastra</button>
    </main>

</body>
</html>
