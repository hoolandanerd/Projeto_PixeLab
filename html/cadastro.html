<DOCTYPE HMTL>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixeLab</title>
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT" crossorigin="anonymous">
    
</head>
<body>
    <header>
        <img class="logo_login" src="/imagens/logo-principal.svg" alt="logo do site">
    </header>
    <main>
        <section class="formulario">
            <p>Prenche os dados para o cadastro </p>
            <label for="nome">Nome completo:</label>
            <input type="text" name="nome" id="nome" required>
            <label for="cpf">CPF:</label>
            <input type="text" name="cpf" id="cpf" required>
            <label for="data">Data de nascimento:</label>
            <input type="date" name="data" id="data">
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
            <label for="celular">Celular:</label>
            <input type="tel" name="celular" id="celular" required placeholder="(00) 00000-0000">
            <label for="senha">Senha:</label>
            <input type="password" name="senha" id="senha" required>
            <label for="confirma">Confirmar senha:</label>
            <input type="password" name="confirma" id="confirma">
        </section>
        <button type="button"  class="btn btn-outline-primary btn-cadastrar">Cadastrar</button>
    </main>

</body>
</html>
