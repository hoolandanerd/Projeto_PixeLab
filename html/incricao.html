<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/botoes.css">
    <link rel="stylesheet" href="/css/perfil.css">
    
    <title>PixeLab</title>
</head>
<body>
  
    <header>
        <!-- Barra de navegação -->
        <div class="menu">
        <button type="button" id="botao-menu" class="icone-menu" aria-label="Abrir menu">
            <img src="/imagens/icone-menu.png" alt="">
        </button>

        <button type="button" id="pesquisa" class="lupa" aria-label="Pesquisar">
            <img src="/imagens/icone-lupa.png" alt="">
        </button>

        <a href="/html/index.html" class="logo">
            <img src="/imagens/logo-horizontal.svg" alt="PixelLab Cursos de Tecnologia">
        </a>

        <a href="/html/login.html" id="botao-perfil" class="foto-perfil" aria-label="Abrir perfil">
            <img src="/imagens/foto-perfil.png" alt="Área da foto e acesso ao perfil">
        </a>
        </div>

    </header>
    <main>
        <h1>Incrições</h1>
        <div class="campo-curso">
            <label class="tit_curso" for="curso">Selecione o Curso</label>
            <details class="seletor-curso">
                <summary>Cursos</summary>
                <div class="opcoes-curso">
                    <label><input type="radio" name="curso" value="1"> Informática</label>
                    <label><input type="radio" name="curso" value="2"> Redes</label>
                    <label><input type="radio" name="curso" value="3"> Desenvolvimento</label>
                </div>
            </details>
        </div>
        <section>
            <h2>Forma de Ingressar</h2>
            <div class="ingressar_curso">
            <label><input type="radio" name="Ingressar" value="1">Enem</label>
            <label><input type="radio" name="Ingressar" value="2">Prova Online</label>
            <label><input type="radio" name="Ingressar" value="3">Segunda Graduação</label>
            </div>
        </section>
        <button type="button"  class=" incri btn btn-outline-primary">Prosseguir</button>
    </main>
    <footer>
        <section class="contatos">
            <h6>Contato</h6>
            <address>
                <p>Email: <a href="mailto:pixelab@outlook.com">pixelab@outlook.com</a></p>
                <p>Telefone: <a href="tel:+5599999999999">(99) 99999-9999</a></p>
            </address>
        </section>

        <section class="redes-sociais">
            <h6>Redes Sociais</h6>
            <ul>
                <li><a href="#">Facebook</a></li>
                <li><a href="#">Instagram</a></li>
            </ul>
        </section>

        <img class="footer-logo" src="/imagens/logo-monocromatica-branca.svg" alt="Logo do Footer">

        <p class="direitos-autorais">
            <small>© PixelLab 2026 - 2027. Todos os direitos reservados.</small>
        </p>
    </footer>
</body>
</html>
